<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Flutt-Water</title>
<link rel="manifest" href="./manifest.json"/>
<meta name="theme-color" content="#10263F"/>
<link rel="icon" href="./icons/icon-192.png"/>
<!-- iOS: Safari no lee manifest.json, necesita estas etiquetas aparte -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Flutt-Water"/>
<link rel="apple-touch-icon" href="./icons/icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet"/>
<script defer crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script defer crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/firebase@12.17.1/firebase-app-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/firebase@12.17.1/firebase-auth-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/firebase@12.17.1/firebase-firestore-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/firebase@12.17.1/firebase-app-check-compat.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --fw-navy:#102A43; --fw-navy-deep:#0F172A; --fw-aqua:#19C3D1; --fw-aqua-action:#0B7285;
    --fw-bg:#F7FAFC; --fw-surface:#FFFFFF; --fw-border:#CBD5E1; --fw-text:#102A43; --fw-text-muted:#52606D;
    --fw-success:#087F5B; --fw-warning:#8A5A00; --fw-danger:#C92A2A;
    --bg:var(--fw-bg); --surface:var(--fw-surface); --surface-2:#F0F5F8;
    --ink:var(--fw-text); --ink-soft:var(--fw-text-muted); --ink-faint:#718096;
    --line:var(--fw-border); --line-strong:#94A3B8;
    --rail:var(--fw-navy); --rail-border:#244563; --rail-ink:#F7FAFC; --rail-ink-faint:#B8C7D6;
    --accent:var(--fw-aqua); --accent-text:var(--fw-aqua-action); --accent-ink:#FFFFFF;
    --info:#0B7285; --info-text:#075985; --info-bg:#DDF4F6;
    --ok:var(--fw-success); --ok-text:var(--fw-success); --ok-bg:#E3F5EE;
    --danger:var(--fw-danger); --danger-text:var(--fw-danger); --danger-bg:#FDE8E7;
    --warn:var(--fw-warning); --warn-text:var(--fw-warning); --warn-bg:#FFF3D6;
    --admin:#334E68; --font-display:'Inter',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  html,body{height:100%;width:100%;max-width:100%;background:var(--fw-bg);color:var(--fw-text);font-family:var(--font-body);overflow-x:hidden}
  #root{width:100%;max-width:420px;min-width:0;margin:0 auto;min-height:100vh;position:relative;overflow-x:clip}
  .flutt-water-app-shell{min-height:100vh}
  .flutt-water-config-header,.flutt-water-config-tabs{width:100%;min-width:0}
  #root img,#root svg,#root canvas,#root video,#root iframe{max-width:100%}
  #root input,#root select,#root textarea,#root button{max-width:100%;min-width:0;box-sizing:border-box}
  body{scrollbar-width:none}

  /* Flutt-Water v47: la experiencia móvil sigue siendo la base. Estas reglas
     solo se activan en pantallas anchas y no alteran el layout compacto. */
  @media (max-width:767px){
    .flutt-water-config-tabs{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;gap:8px!important}
    .flutt-water-config-tabs button{width:100%!important;min-width:0!important;flex:none!important}
    .flutt-water-config-header{display:flex!important;align-items:center!important}
    .flutt-water-config-header > div{min-width:0}
  }
  @media (min-width:768px){
    #root{max-width:none!important;margin:0}
    .flutt-water-topbar,.flutt-water-accent-bar,.flutt-water-offline-banner,.flutt-water-nav-shell{
      max-width:none!important;left:0!important;transform:none!important
    }
    .flutt-water-app-shell{padding-left:260px!important}
    .flutt-water-config-tabs{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;gap:10px!important}
    .flutt-water-config-tabs button{width:100%!important;min-width:0!important;flex:none!important}
    .flutt-water-main-content{
      width:100%;max-width:1600px;min-width:0;margin:0 auto;
      padding-left:0;padding-right:28px
    }
    .flutt-water-topbar{padding-left:260px!important;padding-right:28px!important}
    .flutt-water-offline-banner{
      padding-left:260px!important;padding-right:28px!important;text-align:left!important
    }
    .flutt-water-nav-shell{right:0!important}
    .flutt-water-nav-shell nav{
      transform:translateX(0)!important;box-shadow:none!important
    }
    .flutt-water-menu-toggle{display:none!important}
    .flutt-water-login-shell{padding:48px 24px!important}
    .flutt-water-login-logo{width:100px!important;height:100px!important}
    .flutt-water-login-title{font-size:32px!important}
    .flutt-water-login-subtitle{font-size:13px!important;margin-bottom:32px!important}
    .flutt-water-login-panel{max-width:460px!important;padding:32px!important}
  }
  @media (min-width:1280px){
    .flutt-water-app-shell{padding-left:280px!important}
    .flutt-water-main-content{padding-left:0;padding-right:40px}
    .flutt-water-topbar{padding-left:280px!important;padding-right:40px!important}
    .flutt-water-offline-banner{padding-left:280px!important;padding-right:40px!important}
  }
  ::-webkit-scrollbar{display:none}
  input:focus{outline:none!important;border-color:var(--fw-aqua-action)!important}
  button,select{font-family:inherit}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--fw-aqua);outline-offset:2px}
  button:not(:disabled),select:not(:disabled),input:not(:disabled),textarea:not(:disabled){min-height:48px}
  *{-webkit-tap-highlight-color:transparent}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}}

</style>
</head>
<body>
<div id="root"><div style="display:flex;justify-content:center;align-items:center;height:100vh;color:var(--ink-soft);font-size:14px">Iniciando…</div></div>
<script defer src="./firebase-init.js"></script>
  <script defer src="./branding.js"></script>
  <script defer src="./medidores-config.js"></script>
  <script defer src="./app-core.js"></script>
  <script defer src="./ventas-offline.js"></script>
  <script defer src="./borradores.js"></script>
  <script defer src="./sesion.js"></script>
<script defer src="./auth.js"></script>
<script defer src="./dashboard.js"></script>
  <script defer src="./productos.js"></script>
  <script defer src="./codigos-barras.js"></script>
  <script defer src="./clientes.js"></script>
<script defer src="./pedidos.js"></script>
<script defer src="./creditos.js"></script>
<script defer src="./ruta.js"></script>
<script defer src="./vehiculos.js"></script>
<script defer src="./config.js"></script>

<script defer src="./rutas-repartidores.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW registrado:', reg.scope))
        .catch(err => console.warn('SW no se pudo registrar:', err));
    });
  }
</script>
</body>
</html>
